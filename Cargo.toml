[package]
name = "rmcp-learn"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
rmcp = { version = "3.8.0", features = ["server", "transport-io", "transport-streamable-http-server"] }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.54.1", features = ["macros", "net", "rt-multi-thread"] }
